[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
	".venv",
	".history",
	"__pycache__",
	".pytest_cache",
	".tmp",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
follow_imports = "skip"
check_untyped_defs = false
